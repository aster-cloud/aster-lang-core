name: Corpus regression (dispatched)

# P0-5: 当 aster-lang-test 的 corpus 改动时由 repository_dispatch 触发
# 拉指定 sha 的 corpus + sibling lexicon 仓库，跑 TsSampleParseInventoryTest

on:
  repository_dispatch:
    types: [corpus-changed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: aster-lang-core

      # 共享版本目录（aster-lang-platform，ADR 0012）—— core settings 依赖它。
      - uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-test
          path: aster-lang-test
          ref: ${{ github.event.client_payload.sha || 'main' }}
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      # Lexicon siblings（与 ci.yml 一致）
      - uses: actions/checkout@v6
        with: { repository: aster-cloud/aster-lang-en, path: aster-lang-en, token: '${{ secrets.CROSS_REPO_TOKEN }}' }
      - uses: actions/checkout@v6
        with: { repository: aster-cloud/aster-lang-zh, path: aster-lang-zh, token: '${{ secrets.CROSS_REPO_TOKEN }}' }
      - uses: actions/checkout@v6
        with: { repository: aster-cloud/aster-lang-de, path: aster-lang-de, token: '${{ secrets.CROSS_REPO_TOKEN }}' }

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # core settings.gradle imports the catalog — publish it to Maven
      # Local before any core gradle invocation.
      - name: Publish version catalog to Maven Local
        working-directory: aster-lang-platform
        run: ./gradlew publishToMavenLocal

      # 发布测试 corpus 到 Maven Local（core test 的 testImplementation 依赖）。
      # aster-lang-test 转私后 GH Packages 上的 cloud.aster-lang:aster-lang-test
      # 也随之私有，远程解析会失败；改为从上面已 checkout 的源码就地构建。
      # 与 ci.yml 的 Phase 2b 同范式。
      - name: Publish test corpus to Maven Local
        working-directory: aster-lang-test/packages/jvm
        run: ./gradlew publishToMavenLocal -x test

      - name: Run corpus regression tests
        working-directory: aster-lang-core
        env:
          ASTER_LANG_TEST_PATH: ${{ github.workspace }}/aster-lang-test
        run: |
          ./gradlew test --tests '*Corpus*' --tests '*TsSampleParseInventory*' --no-daemon
