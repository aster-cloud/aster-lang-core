name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 ref 上新 push 到来时取消尚在跑的过时 CI（PR 连续 push 常见）——省算力/排队。
# 该仓 CI 无发布/部署副作用（release 是独立 workflow），故可直接 cancel 过时 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      # 共享版本目录（aster-lang-platform，ADR 0012）。core 的 settings.gradle
      # 导入它，故必须在任何 core gradle 调用前发布到 Maven Local。
      # 兄弟仓用分支匹配 checkout（./.github/actions/checkout-sibling）：存在与本
      # PR 同名分支则用之，否则回退 main —— 让跨仓 PR 合并前即可联合验证。
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      # 防漂移 gate（ADR 0023 阶段6）：本仓版本/platform pin 必须符合 release-plan.json
      # 单一事实源（脚本在 platform 仓，单点维护）。PR 时即拦截漂移，不等到发布。
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Release-plan drift gate
        run: |
          python3 aster-lang-platform/scripts/release-plan/check-artifact.py \
            --plan aster-lang-platform/release-plan.json \
            --artifact core:maven --repo-root .

      # 语言包源：aster-lang-locales（现役，catalog 驱动）。旧独立 en/zh/de 仓已归档。
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-locales
          path: aster-lang-locales
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      # aster-lang-hi 语言包：core 的 testRuntimeOnly(asterLibs.hi) + langPacks 依赖它，
      # 缺这步会让 :testRuntimeClasspath 解析 aster-lang-hi:<ver> 失败（干净 runner 无 hi）。
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-hi
          path: aster-lang-hi
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      # 共享测试 corpus（cloud.aster-lang:aster-lang-test）。core 的
      # testImplementation(asterLibs.test) 依赖它；GH Packages 未必有当前版本，
      # 故 sibling-checkout 后 publishToMavenLocal（与下方 parity job 同范式）。
      # 缺这步会让 :testCompileClasspath 解析 aster-lang-test:<ver> 失败。
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-test
          path: aster-lang-test
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # Phase 0: 发布共享版本目录到 Maven Local（core settings 依赖它）
      - name: Publish version catalog
        run: cd aster-lang-platform && ./gradlew publishToMavenLocal

      # Phase 1: 编译 core 并发布到 Maven Local（供 lang packs 依赖）
      - name: Compile & publish core
        run: ./gradlew compileJava publishToMavenLocal -x test

      # Phase 2: 构建 lang packs（core 测试需要 SPI 发现它们）。core 软链到
      # aster-lang-core/ 让 locales 的 verifyLexiconParity 跑而非跳过。
      - name: Build lang packs (from aster-lang-locales)
        run: |
          ln -sfn "$PWD" aster-lang-core
          cd aster-lang-locales && ./gradlew publishToMavenLocal -x test

      # Phase 2a: 发布 hi 语言包（core testRuntimeOnly/langPacks 依赖）。
      - name: Build hi lang pack (from aster-lang-hi)
        run: cd aster-lang-hi && ./gradlew publishToMavenLocal -x test

      # Phase 2b: 发布测试 corpus 到 Maven Local（core test 的 testImplementation 依赖）。
      - name: Publish test corpus to Maven Local
        working-directory: aster-lang-test/packages/jvm
        run: ./gradlew publishToMavenLocal -x test

      # Phase 3: 运行 core 完整构建（含测试）
      - name: Test
        run: ./gradlew test

  # Strict tier1 dual-engine parity gate. Mirrors aster-lang-test's
  # parity-tier1 job so a Java grammar change that breaks bidirectional
  # parity is blocked at the source PR — not weeks later when the
  # corpus repo's CI runs over a merged change.
  #
  # Only runs when grammar/parser/AST/lowering paths change, to keep
  # narrow refactors (docs, tests-only) cheap.
  parity-tier1:
    name: Strict tier1 parity — parse (TS ↔ Java)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # gradle 拉取跨仓 GitHub Packages（含 aster-lang-hi 语言包）需要跨仓读权限。
    # 默认 GITHUB_TOKEN 仅当前仓，拉 hi 包会 401；CROSS_REPO_TOKEN 是 org secret，
    # 已被 checkout-sibling steps 使用，此处同样用于 gradle credentials。
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      # R-CI-1 fix: paths-filter needs a checkout to diff against. Do
      # the self-checkout first into a sub-path, then point paths-filter
      # at it with working-directory.
      - name: Self checkout
        uses: actions/checkout@v6
        with:
          path: aster-lang-core
          fetch-depth: 0

      - name: Decide whether to run
        id: changed
        uses: dorny/paths-filter@v4
        with:
          working-directory: aster-lang-core
          filters: |
            parity:
              - 'src/main/**'
              - 'src/test/java/aster/core/dualengine/**'
              - 'build.gradle.kts'
              - '.github/workflows/ci.yml'

      # 兄弟仓 checkout 走分支匹配（self checkout 进了 aster-lang-core/ 子目录，
      # 故复合 action 路径带前缀 ./aster-lang-core/...）。匹配同名 PR 分支，
      # 否则回退 main —— 跨仓 PR 合并前联合验证。
      - name: Checkout aster-lang-platform
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout aster-lang-test
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-test
          path: aster-lang-test
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout aster-lang-ts
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-ts
          path: aster-lang-ts
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout aster-lang-locales
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-locales
          path: aster-lang-locales
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      # aster-lang-hi 语言包（hi-IN SPI）：verify:lexicon-sync 需要它进 exportLexicons
      # 的 langPacks classpath，才能校验 hi-IN 词法与 TS 同步（此前无守门）。
      - name: Checkout aster-lang-hi
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-hi
          path: aster-lang-hi
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      # aster-lang-runtime + aster-lang-truffle are only needed by the
      # Phase C evaluator step (CoreIrEvalCli lives in truffle).
      - name: Checkout aster-lang-runtime
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-runtime
          path: aster-lang-runtime
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
      - name: Checkout aster-lang-truffle
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-truffle
          path: aster-lang-truffle
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Setup pnpm
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: aster-lang-ts/pnpm-lock.yaml

      - name: Setup Java
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build aster-lang-ts
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        working-directory: aster-lang-ts
        run: pnpm install --frozen-lockfile && pnpm build

      # See aster-lang-test/.github/workflows/ci.yml for the full
      # rationale: publish core + locale packs + corpus to Maven Local
      # before gradle test, otherwise gradle falls back to GitHub
      # Packages and fails with 401. THIS PR's aster-lang-core is the
      # one we want under test, so publishing it locally is also what
      # ensures the gate evaluates the right version.
      # Publish the shared version catalog first — aster-lang-core's
      # settings.gradle imports it (ADR 0012), so it must be in Maven
      # Local before any core gradle invocation below.
      - name: Publish version catalog to Maven Local
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        working-directory: aster-lang-platform
        run: ./gradlew publishToMavenLocal

      - name: Publish aster-lang-core to Maven Local
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        working-directory: aster-lang-core
        run: ./gradlew compileJava publishToMavenLocal -x test

      - name: Publish locale packs to Maven Local
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        working-directory: aster-lang-locales
        run: ./gradlew publishToMavenLocal -x test

      - name: Publish aster-lang-hi to Maven Local
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        working-directory: aster-lang-hi
        run: ./gradlew publishToMavenLocal -x test

      # 词法同步守门（此前零 CI 调用）：从源码联编的 core + 四语包 exportLexicons，
      # 再由 TS verify-lexicon-sync 校验 Java↔TS 词法表（含 hi-IN）完全同步。
      # 依赖上面已 publishToMavenLocal 的 platform/core/locales/hi（源码新版）。
      - name: Verify lexicon sync (Java exportLexicons ↔ TS)
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        shell: bash
        run: |
          set -o pipefail
          cd aster-lang-core && ./gradlew exportLexicons -x test
          cd ../aster-lang-ts
          node dist/scripts/verify-lexicon-sync.js \
            ../aster-lang-core/build/generated/lexicons/lexicons.json

      - name: Publish aster-lang-runtime to Maven Local
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        working-directory: aster-lang-runtime
        run: ./gradlew publishToMavenLocal -x test

      - name: Publish corpus to Maven Local
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        working-directory: aster-lang-test/packages/jvm
        run: ./gradlew publishToMavenLocal -x test

      - name: Run tier1-parity strict gate (parse, PR-blocking)
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        working-directory: aster-lang-test
        shell: bash
        run: |
          set -o pipefail
          node scripts/parity-tier1.mjs --mode=parse

      # Phase B IR fingerprint parity —— 仍为 report-only，但这是**有据的例外**而非默认。
      #
      # 2026-07-29 实测：218 个样本中 2 个真分叉，均出在 `Use <Module> as <Alias>`
      # 的导入别名处理上——TS 为被导入模块生成 decl（declNames.tsOnly:
      # ["Db","Http","Time"] / ["Http"]），Java 不生成。哪一侧是正确语义需要一次
      # 独立的设计裁决，不能在「修 CI」的改动里顺手拍板，故暂不阻断。
      # ★收敛条件：上述 2 例消解后，本步应与 eval 一样去掉 continue-on-error。
      - name: Run tier1-parity (IR fingerprint, report-only)
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        working-directory: aster-lang-test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/parity-tier1.mjs --mode=ir --report-only | tee parity-tier1-ir-report.md

      # Phase C evaluator parity —— **PR-blocking**（2026-07-29 审计修复）。
      #
      # 此前是 continue-on-error + --report-only，标注「first cycle」却无到期日：
      # 两个引擎的求值结果分叉不会让 CI 变红，等于这一层 parity 是装饰性的。
      # 本地实测当前 298/298 identical、0 divergent，具备直接阻断的条件，故去掉
      # 两个静音开关。aster-lang-test 的 ci.yml 早已完成同样的收紧，此处是补传播。
      - name: Run tier1-parity (eval)
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        working-directory: aster-lang-test
        shell: bash
        run: |
          set -o pipefail
          node scripts/parity-tier1.mjs --mode=eval | tee parity-tier1-eval-report.md

      - name: Upload parity reports
        if: always() && (steps.changed.outputs.parity == 'true' || github.event_name == 'push')
        uses: actions/upload-artifact@v7
        with:
          name: parity-tier1-${{ github.run_id }}
          path: |
            aster-lang-test/parity-tier1-report.json
            aster-lang-test/parity-tier1-ir-report.md
            aster-lang-test/parity-tier1-eval-report.md
          if-no-files-found: warn
