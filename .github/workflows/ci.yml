name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      # 共享版本目录（aster-lang-platform，ADR 0012）。core 的 settings.gradle
      # 导入它，故必须在任何 core gradle 调用前发布到 Maven Local。
      - uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-en
          path: aster-lang-en
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-zh
          path: aster-lang-zh
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-de
          path: aster-lang-de
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # Phase 0: 发布共享版本目录到 Maven Local（core settings 依赖它）
      - name: Publish version catalog
        run: cd aster-lang-platform && ./gradlew publishToMavenLocal

      # Phase 1: 编译 core 并发布到 Maven Local（供 lang packs 依赖）
      - name: Compile & publish core
        run: ./gradlew compileJava publishToMavenLocal -x test

      # Phase 2: 构建 lang packs（core 测试需要 SPI 发现它们）
      - name: Build lang packs
        run: |
          cd aster-lang-en && ./gradlew publishToMavenLocal -x test
          cd ../aster-lang-zh && ./gradlew publishToMavenLocal -x test
          cd ../aster-lang-de && ./gradlew publishToMavenLocal -x test

      # Phase 3: 运行 core 完整构建（含测试）
      - name: Test
        run: ./gradlew test

  # Strict tier1 dual-engine parity gate. Mirrors aster-lang-test's
  # parity-tier1 job so a Java grammar change that breaks bidirectional
  # parity is blocked at the source PR — not weeks later when the
  # corpus repo's CI runs over a merged change.
  #
  # Only runs when grammar/parser/AST/lowering paths change, to keep
  # narrow refactors (docs, tests-only) cheap.
  parity-tier1:
    name: Strict tier1 parity — parse (TS ↔ Java)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # R-CI-1 fix: paths-filter needs a checkout to diff against. Do
      # the self-checkout first into a sub-path, then point paths-filter
      # at it with working-directory.
      - name: Self checkout
        uses: actions/checkout@v6
        with:
          path: aster-lang-core
          fetch-depth: 0

      - name: Decide whether to run
        id: changed
        uses: dorny/paths-filter@v3
        with:
          working-directory: aster-lang-core
          filters: |
            parity:
              - 'src/main/**'
              - 'src/test/java/aster/core/dualengine/**'
              - 'build.gradle.kts'
              - '.github/workflows/ci.yml'

      - name: Checkout aster-lang-platform
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout aster-lang-test
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-test
          path: aster-lang-test
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout aster-lang-ts
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-ts
          path: aster-lang-ts
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout aster-lang-en
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-en
          path: aster-lang-en
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
      - name: Checkout aster-lang-zh
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-zh
          path: aster-lang-zh
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
      - name: Checkout aster-lang-de
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-de
          path: aster-lang-de
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      # aster-lang-runtime + aster-lang-truffle are only needed by the
      # Phase C evaluator step (CoreIrEvalCli lives in truffle).
      - name: Checkout aster-lang-runtime
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-runtime
          path: aster-lang-runtime
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
      - name: Checkout aster-lang-truffle
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-truffle
          path: aster-lang-truffle
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Setup pnpm
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: aster-lang-ts/pnpm-lock.yaml

      - name: Setup Java
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build aster-lang-ts
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        working-directory: aster-lang-ts
        run: pnpm install --frozen-lockfile && pnpm build

      # See aster-lang-test/.github/workflows/ci.yml for the full
      # rationale: publish core + locale packs + corpus to Maven Local
      # before gradle test, otherwise gradle falls back to GitHub
      # Packages and fails with 401. THIS PR's aster-lang-core is the
      # one we want under test, so publishing it locally is also what
      # ensures the gate evaluates the right version.
      # Publish the shared version catalog first — aster-lang-core's
      # settings.gradle imports it (ADR 0012), so it must be in Maven
      # Local before any core gradle invocation below.
      - name: Publish version catalog to Maven Local
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        working-directory: aster-lang-platform
        run: ./gradlew publishToMavenLocal

      - name: Publish aster-lang-core to Maven Local
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        working-directory: aster-lang-core
        run: ./gradlew compileJava publishToMavenLocal -x test

      - name: Publish locale packs to Maven Local
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        run: |
          cd aster-lang-en && ./gradlew publishToMavenLocal -x test
          cd ../aster-lang-zh && ./gradlew publishToMavenLocal -x test
          cd ../aster-lang-de && ./gradlew publishToMavenLocal -x test

      - name: Publish aster-lang-runtime to Maven Local
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        working-directory: aster-lang-runtime
        run: ./gradlew publishToMavenLocal -x test

      - name: Publish corpus to Maven Local
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        working-directory: aster-lang-test/packages/jvm
        run: ./gradlew publishToMavenLocal -x test

      - name: Run tier1-parity strict gate (parse, PR-blocking)
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        working-directory: aster-lang-test
        shell: bash
        run: |
          set -o pipefail
          node scripts/parity-tier1.mjs --mode=parse

      # Phase B IR fingerprint parity — report-only for first cycle.
      # See aster-lang-test/.github/workflows/ci.yml for full rationale.
      - name: Run tier1-parity (IR fingerprint, report-only)
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        working-directory: aster-lang-test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/parity-tier1.mjs --mode=ir --report-only | tee parity-tier1-ir-report.md

      # Phase C evaluator parity — report-only first cycle.
      - name: Run tier1-parity (eval, report-only)
        if: steps.changed.outputs.parity == 'true' || github.event_name == 'push'
        working-directory: aster-lang-test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/parity-tier1.mjs --mode=eval --report-only | tee parity-tier1-eval-report.md

      - name: Upload parity reports
        if: always() && (steps.changed.outputs.parity == 'true' || github.event_name == 'push')
        uses: actions/upload-artifact@v7
        with:
          name: parity-tier1-${{ github.run_id }}
          path: |
            aster-lang-test/parity-tier1-report.json
            aster-lang-test/parity-tier1-ir-report.md
            aster-lang-test/parity-tier1-eval-report.md
          if-no-files-found: warn
