name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # 共享版本目录（aster-lang-platform，ADR 0012）—— core settings 依赖它。
      - uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-en
          path: aster-lang-en
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-zh
          path: aster-lang-zh
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-de
          path: aster-lang-de
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      # 共享测试语料（cloud.aster-lang:aster-lang-test）—— core 的测试编译/运行
      # 依赖它。发布到 Maven Local 避免从 GitHub Packages 拉取（跨仓 401）。
      - uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-test
          path: aster-lang-test
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # 发布共享版本目录到 Maven Local（core settings 依赖它）
      - name: Publish version catalog locally
        run: cd aster-lang-platform && ./gradlew publishToMavenLocal

      # 编译 core 并发布到 Maven Local（供 lang packs 依赖）
      - name: Compile & publish core locally
        run: ./gradlew compileJava publishToMavenLocal -x test

      # 构建 lang packs（core 测试需要 SPI 发现它们）
      - name: Build lang packs
        run: |
          cd aster-lang-en && ./gradlew publishToMavenLocal -x test
          cd ../aster-lang-zh && ./gradlew publishToMavenLocal -x test
          cd ../aster-lang-de && ./gradlew publishToMavenLocal -x test

      # 发布测试语料 jar 到 Maven Local（core 测试编译/运行依赖它）
      - name: Publish test corpus locally
        run: cd aster-lang-test/packages/jvm && ./gradlew publishToMavenLocal

      - name: Build & Test
        run: ./gradlew build

      - name: Publish to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
