name: Release

on:
  push:
    tags: ['v*']
  # orchestrator（aster-lang-platform/release-train.yml）入口：dispatch 只创建并
  # push tag（用 CROSS_REPO_TOKEN，PAT 才能让 tag-push 再触发 publish——GITHUB_TOKEN
  # 推的 tag 不会触发 workflow）。真正 publish 仍只走下面的 tag-push 路径，保留
  # tag==version gate 与既有发布语义。详见 ADR 0023 阶段2。
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本（不含 v 前缀），须等于 build.gradle.kts 的 version'
        required: true
        type: string
      artifactIds:
        description: 'release-plan 的 artifact id 列表（逗号分隔，审计用）'
        required: false
        type: string
      trainId:
        description: 'release train 标识（审计用）'
        required: false
        type: string

# dispatch(vX) 与 tag-push(vX) 用同一 concurrency group（inputs.version 不含 v 前缀，
# 补 format 成 vX 对齐 ref_name），串行化同版本的 create-tag 与 publish。
concurrency:
  group: release-${{ github.repository }}-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  # dispatch 路径：仅创建 tag（用 PAT），让既有 tag-push publish 复用。
  create-tag:
    # 仅允许从默认分支 dispatch，避免给某个 version 恰好匹配的 feature 分支 HEAD 打 release tag。
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0
      # catalog-derived version（ADR 0023 §9）：version = asterLibs.findVersion("asterLang")，
      # 不再 sed 字面量。settings 只声明 mavenLocal+mavenCentral → 先 checkout platform 并
      # publishToMavenLocal，本仓 Gradle 才能解析 catalog 派生的 project version。与 hi/locales 同构。
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'temurin' }
      - name: Bootstrap version catalog to Maven Local
        run: cd aster-lang-platform && ./gradlew publishToMavenLocal
      - name: Create & push release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          RESOLVED=$(./gradlew -q properties | sed -n 's/^version: //p' | head -n1)
          if [ "$VERSION" != "$RESOLVED" ]; then
            echo "::error::dispatch version ($VERSION) != Gradle-resolved catalog version ($RESOLVED)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          TAG="v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA=$(git rev-list -n1 "$TAG"); HEAD_SHA=$(git rev-parse HEAD)
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "::notice::$TAG already on this commit → no-op (idempotent)"; exit 0
            fi
            echo "::error::$TAG exists but points to $TAG_SHA, not HEAD $HEAD_SHA"; exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"

  publish:
    # tag-push 路径（含 orchestrator create-tag 推的 tag）才真正发布。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # 共享版本目录（aster-lang-platform，ADR 0012）—— core settings 依赖它。
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      # 语言包源：aster-lang-locales（多模块 en/zh/de，ADR-0011 后的现役源）。
      # 旧的独立 aster-lang-en/zh/de 仓已归档（read-only，硬编码 pin core:1.0.2）——
      # 不再用它们当 sibling，改用 locales（catalog 驱动，自动解析当前 core 版本）。
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-locales
          path: aster-lang-locales
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      # 共享测试语料（cloud.aster-lang:aster-lang-test）—— core 的测试编译/运行
      # 依赖它。发布到 Maven Local 避免从 GitHub Packages 拉取（跨仓 401）。
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-test
          path: aster-lang-test
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # 发布共享版本目录到 Maven Local（core settings 依赖它）
      - name: Publish version catalog locally
        run: cd aster-lang-platform && ./gradlew publishToMavenLocal

      # 校验推送的 v* tag 与 catalog-derived project version 一致（ADR 0023 §9）。
      # version 已从 catalog 的 asterLang 派生（不再字面量），故用 Gradle 解析而非 sed。
      # 须在 catalog publishToMavenLocal 之后跑（否则本仓 Gradle 配置期解析不到 catalog）。
      # 不一致即提前失败，避免 v1.0.3 tag 却发布出 1.0.2 的版本漂移（#26）。
      - name: Verify tag matches catalog-derived version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          RESOLVED=$(./gradlew -q properties | sed -n 's/^version: //p' | head -n1)
          if [ "$TAG_VERSION" != "$RESOLVED" ]; then
            echo "Error: Tag version ($TAG_VERSION) != Gradle-resolved catalog version ($RESOLVED)"
            exit 1
          fi

      # 编译 core 并发布到 Maven Local（供 lang packs 依赖）
      - name: Compile & publish core locally
        run: ./gradlew compileJava publishToMavenLocal -x test

      # locales 的 verifyLexiconParity 找 sibling aster-lang-core/（en-US.json byte-parity
      # 校验）。core 在本 workflow checkout 到 workspace 根，软链一份到 aster-lang-core/
      # 让 parity gate 跑而非静默跳过。
      - name: Symlink core for locales parity gate
        run: ln -sfn "$PWD" aster-lang-core

      # 构建 lang packs（core 测试需要 SPI 发现它们）。locales 多模块根
      # publishToMavenLocal 一次产出 en/zh/de 全部制品（catalog 驱动 → 解析当前 core）。
      - name: Build lang packs (from aster-lang-locales)
        run: cd aster-lang-locales && ./gradlew publishToMavenLocal -x test

      # 发布测试语料 jar 到 Maven Local（core 测试编译/运行依赖它）
      - name: Publish test corpus locally
        run: cd aster-lang-test/packages/jvm && ./gradlew publishToMavenLocal

      # 发布时只 assemble 制品，**不跑 test**（-x test）。原因：core:test 有 testRuntimeOnly(hi) +
      # langPacks(hi) 的**前向依赖**——hi 在 release-train DAG 里晚于 core 一层（hi impl(core)），
      # lockstep bump 后 core:test 会要 hi:<新版>，而该版本此刻尚未发布 → 解析 401，卡住级联。
      # 测试已在 PR CI 阶段跑过（发布前门），发布步骤无须重测。与上面依赖 publishToMavenLocal 步骤
      # 已用的 -x test 一致。
      - name: Build (assemble only, tests ran in PR CI)
        run: ./gradlew build -x test

      - name: Publish to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
